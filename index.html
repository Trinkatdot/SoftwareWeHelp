<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/cadastro.css">
    <title>Cadasatro</title>
</head>

<body>
    <main class="container">
        <div class="logo">
            <img src="./img/logo_1-removed.png" alt="We Five Tecnologia">
        </div>
        <section class="formulario">
            <a class="icon_help" href="#">?</a>
            <div>
                <form action="#" method="get">
                    <h3>Cadastre-se</h3>


                    <input type="text" placeholder="Digite Seu Nome Completo" required>


                    <input type="email" placeholder="Informe o seu E-mail." required>

                    <select class="slt_container" name="slt_depart" id="slt_depart" required>
                        <option value="adm">ADM</option>
                        <option value="fin">Financeiro</option>
                        <option value="dir">Diretoria</option>
                        <option value="op">Operacional</option>
                    </select>

                    <input placeholder="Digite o ID da Máquina" type="number" required>

                    <input placeholder="Digite uma Senha" type="password" required>

                    <input placeholder="Digite Novamente a Senha" type="password" required>

                    <div class="container-btn">
                        <a href="#">Já Possui Cadastro? <span>Entre Aqui.</span></a>

                        <button class="btnregister">Cadastrar</button>
                    </div>

                </form>
            </div>
        </section>
    </main>
</body>

</html>
